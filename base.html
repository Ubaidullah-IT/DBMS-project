<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Neon ToDo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/neon.css') }}">
</head>
<body>
  <div style="max-width:1200px;margin:0 auto;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="position:fixed;right:18px;top:18px;z-index:9999;">
        {% for cat, msg in messages %}
          <div style="margin-bottom:8px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.03);border-left:4px solid var(--accent1);">
            <strong style="display:block;font-size:13px">{{ msg }}</strong>
          </div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
